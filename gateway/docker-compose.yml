services:
  litellm:
    build:
      context: .
      dockerfile: Dockerfile.litellm
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    command: ["--config", "/app/config.yaml", "--port", "4000", "--host", "0.0.0.0"]
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
      - ./litellm/raw_model_hook.py:/app/raw_model_hook.py:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "4000:4000"
    restart: unless-stopped

  # ---------------- Langfuse v4 self-host (adapted from langfuse/langfuse docker-compose.yml) ----------------
  postgres:
    image: docker.io/postgres:17-alpine
    environment: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: postgres, TZ: UTC, PGTZ: UTC}
    volumes: ["langfuse_postgres_data:/var/lib/postgresql/data"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 3s, timeout: 3s, retries: 10}
    restart: unless-stopped

  clickhouse:
    image: docker.io/clickhouse/clickhouse-server:26.3.62.3
    user: "101:101"
    environment: {CLICKHOUSE_DB: default, CLICKHOUSE_USER: clickhouse, CLICKHOUSE_PASSWORD: clickhouse}
    volumes: ["langfuse_clickhouse_data:/var/lib/clickhouse"]
    healthcheck: {test: "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1", interval: 5s, timeout: 5s, retries: 10, start_period: 1s}
    restart: unless-stopped

  minio:
    image: cgr.dev/chainguard/minio
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" /data'
    environment: {MINIO_ROOT_USER: minio, MINIO_ROOT_PASSWORD: miniosecret}
    volumes: ["langfuse_minio_data:/data"]
    healthcheck: {test: ["CMD", "mc", "ready", "local"], interval: 1s, timeout: 5s, retries: 5, start_period: 1s}
    restart: unless-stopped

  redis:
    image: docker.io/redis:7-alpine
    command: --requirepass myredissecret --maxmemory-policy noeviction
    volumes: ["langfuse_redis_data:/data"]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 3s, timeout: 10s, retries: 10}
    restart: unless-stopped

  langfuse-worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:4
    depends_on: {postgres: {condition: service_healthy}, clickhouse: {condition: service_healthy}, minio: {condition: service_healthy}, redis: {condition: service_healthy}}
    env_file: .env.langfuse
    restart: unless-stopped

  langfuse-web:
    image: docker.langfuse.com/langfuse/langfuse:4
    depends_on: {postgres: {condition: service_healthy}, clickhouse: {condition: service_healthy}, minio: {condition: service_healthy}, redis: {condition: service_healthy}}
    env_file: .env.langfuse
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  langfuse_postgres_data:
  langfuse_clickhouse_data:
  langfuse_minio_data:
  langfuse_redis_data:
